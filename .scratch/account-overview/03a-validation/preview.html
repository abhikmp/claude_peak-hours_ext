<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Account overview production preview</title>
<style>
  body { margin: 32px; background: #111; color: #ddd; font: 14px system-ui; }
  h1 { font-size: 20px; font-weight: 500; margin: 0 0 8px; }
  p { color: #aaa; margin: 0 0 28px; }
  main { display: flex; gap: 28px; flex-wrap: wrap; }
  section > p { margin: 0 0 12px; }
  iframe { width: 260px; height: 340px; border: 0; border-radius: 12px; }
  footer { color: #888; margin-top: 24px; }
</style>
<h1>Account overview · production</h1>
<p>Real popup sources · Compact · 260 × 340</p>
<main>
  <section><p>Three Accounts → individual slides</p><iframe id="slides" title="Three Account slides"></iframe></section>
  <section><p>Active Account</p><iframe id="active" title="Active Account detail"></iframe></section>
  <section><p>Four Accounts → three table rows</p><iframe id="table" title="Compact Account table"></iframe></section>
</main>
<footer>Disposable sample readings. Estimates retain the actual reading age.</footer>
<script>
  for (const id of ['slides', 'active', 'table']) {
    const frame = document.getElementById(id);
    localStorage.removeItem('ticket01-ticket03a-preview-' + id);
    frame.onload = async () => {
      const win = frame.contentWindow;
      const now = win.Date.now();
      const reading = (label, percent, readMinutes, resetMinutes) => ({ label, percent,
        resetsAt: (now + resetMinutes * 60000) / 1000, lastReadingAt: now - readMinutes * 60000 });
      const accounts = {
        active: reading('Research lab', 28, 0, 300),
        personal: reading('Personal workspace', 24, 13, 77),
        writing: reading('Writing room', 94, 181, -6),
        northstar: reading('Northstar Studio', 76, 43, 137)
      };
      if (id === 'slides') delete accounts.northstar;
      await win.chrome.storage.local.set({ accounts });
      setTimeout(() => { if (id !== 'active') win.document.getElementById('account-next').click(); }, 0);
    };
    frame.src = '/popup/popup.html?' + new URLSearchParams({ case: 'ticket03a-preview-' + id, count: id === 'slides' ? 3 : 4, theme: 'dark', products: 'ai', status: 'red' });
  }
</script></html>
